<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation | Jhansi Railway Agency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="images/railway-logo.jiff" alt="Jhansi Railway Agency">
    <div class="brand-text"><small>JHANSI</small><strong>RAILWAY AGENCY</strong></div>
  </a>
  <nav class="nav">
    <a href="index.html">Home</a><a href="trains.html">Trains</a>
    <a href="reservation.html">Reservation</a><a href="booking.html">Booking</a>
    <a href="payment.html">Payment</a><a href="pnr.html">PNR</a>
    <a href="cancellation.html">Cancellation</a><a href="tourism.html">Tourism</a>
  </nav>
</header>

<section class="page-hero">
  <div class="container hero-content">
    <p class="eyebrow">MANAGE RESERVATION</p>
    <h1>Your Reservation</h1>
    <p>Review passenger and journey information before confirming your reservation.</p>
  </div>
</section>

<main class="section">
  <div class="container">
    <div class="card">
      <form data-demo-form>
        <div class="form-grid">
          <div class="form-group"><label>Passenger Name</label><input type="text" placeholder="Enter passenger name" required></div>
          <div class="form-group"><label>Train</label><select><option>Jhansi → Delhi Express</option><option>Delhi → Shimla Scenic</option><option>Mumbai → Goa Premium</option><option>Jhansi → Bhopal Intercity</option></select></div>
          <div class="form-group"><label>Journey Date</label><input type="date" required></div>
          <div class="form-group"><label>Seat Preference</label><select><option>Window</option><option>Any Seat</option><option>Lower Berth</option><option>Upper Berth</option></select></div>
        </div>
        <div class="actions"><button class="btn" type="submit">Confirm Reservation</button></div>
        <p class="message"></p>
      </form>
    </div>
  </div>
</main>

<footer class="footer">Jhansi Railway Agency — Safe Journey • Happy Journey</footer>
<script src="script.js"></script>
</body>
</html>
