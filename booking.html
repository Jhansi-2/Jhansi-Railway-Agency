<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking | Jhansi Railway Agency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="images/railway-logo.jiff" alt="Jhansi Railway Agency">
    <div class="brand-text"><small>JHANSI</small><strong>RAILWAY AGENCY</strong></div>
  </a>
  <nav class="nav">
    <a href="index.html">Home</a><a href="trains.html">Trains</a>
    <a href="reservation.html">Reservation</a><a href="booking.html">Booking</a>
    <a href="payment.html">Payment</a><a href="pnr.html">PNR</a>
    <a href="cancellation.html">Cancellation</a><a href="tourism.html">Tourism</a>
  </nav>
</header>

<section class="page-hero">
  <div class="container hero-content">
    <p class="eyebrow">RAILWAY BOOKING</p>
    <h1>Book Your Journey</h1>
    <p>Enter your journey details and continue with your ticket booking.</p>
  </div>
</section>

<main class="section">
  <div class="container">
    <div class="card">
      <form data-demo-form>
        <div class="form-grid">
          <div class="form-group"><label>From</label><input type="text" value="Jhansi" required></div>
          <div class="form-group"><label>To</label><input type="text" value="Delhi" required></div>
          <div class="form-group"><label>Journey Date</label><input type="date" required></div>
          <div class="form-group"><label>Travel Class</label><select><option>All Classes</option><option>AC First Class</option><option>AC 2 Tier</option><option>AC 3 Tier</option><option>Sleeper</option><option>Chair Car</option></select></div>
        </div>
        <div class="actions"><button class="btn" type="submit">Search & Continue</button></div>
        <p class="message"></p>
      </form>
    </div>
  </div>
</main>

<footer class="footer">Jhansi Railway Agency — Safe Journey • Happy Journey</footer>
<script src="script.js"></script>
</body>
</html>
