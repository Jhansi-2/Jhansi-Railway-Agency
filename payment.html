<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | Jhansi Railway Agency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html">
    <img class="brand-logo" src="images/railway-logo.jiff" alt="Jhansi Railway Agency">
    <div class="brand-text"><small>JHANSI</small><strong>RAILWAY AGENCY</strong></div>
  </a>
  <nav class="nav">
    <a href="index.html">Home</a><a href="trains.html">Trains</a>
    <a href="reservation.html">Reservation</a><a href="booking.html">Booking</a>
    <a href="payment.html">Payment</a><a href="pnr.html">PNR</a>
    <a href="cancellation.html">Cancellation</a><a href="tourism.html">Tourism</a>
  </nav>
</header>

<section class="page-hero">
  <div class="container hero-content">
    <p class="eyebrow">SECURE PAYMENT</p>
    <h1>Complete Payment</h1>
    <p>Frontend payment demonstration — connect an authorized payment gateway before production use.</p>
  </div>
</section>

<main class="section">
  <div class="container">
    <div class="card">
      <form data-demo-form>
        <div class="form-grid">
          <div class="form-group"><label>Cardholder Name</label><input type="text" placeholder="Name on card" required></div>
          <div class="form-group"><label>Card Number</label><input type="text" maxlength="19" placeholder="XXXX XXXX XXXX XXXX" required></div>
          <div class="form-group"><label>Expiry</label><input type="text" placeholder="MM/YY" required></div>
          <div class="form-group"><label>CVV</label><input type="password" maxlength="4" placeholder="CVV" required></div>
        </div>
        <div class="actions"><button class="btn" type="submit">Pay Securely</button></div>
        <p class="message"></p>
      </form>
    </div>
  </div>
</main>

<footer class="footer">Jhansi Railway Agency — Safe Journey • Happy Journey</footer>
<script src="script.js"></script>
</body>
</html>
